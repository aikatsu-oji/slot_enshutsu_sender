<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リールユニット</title>
<style>
  :root{
    --frame:#c9a24a; --frame-bright:#f1d27a; --frame-dim:#7d6328; --frame-shadow:#0b1226;
    --reel-bg:#fdfbf3; --text:#efe6d2;
    --red:#d43a2f; --green:#3fa35b; --yellow:#f2c23b; --blue:#4d8fd6;
    --koma:calc(100vw / 8.4);    /* 1コマの高さ。リール窓は3コマ分。画面幅に追従 */
    --font-sym:"Yu Mincho","Hiragino Mincho ProN",serif;
    --font-ui:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:transparent;             /* OBS用に透過。?bg=00ff00 で色指定 */
    font-family:var(--font-ui);color:var(--text);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }

  /* ---- リールユニット ---- */
  .unit{width:100vw;}
  .navi{display:flex;justify-content:space-around;padding:0 2% 6px;}
  .navi span{
    width:1.6em;height:1.6em;border-radius:50%;font-size:calc(100vw / 40);
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--frame-dim);background:#08060a;color:#3a3020;font-weight:700;transition:all .15s;
  }
  .navi span.on{background:var(--frame-bright);color:var(--frame-shadow);border-color:#fff3c8;box-shadow:0 0 14px var(--frame-bright);}
  .navi.hidden{display:none;}
  .window{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;
    background:linear-gradient(180deg,var(--frame-dim),var(--frame) 20%,var(--frame-bright) 50%,var(--frame) 80%,var(--frame-dim));
    box-shadow:0 6px 0 var(--frame-shadow), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .reel{
    position:relative;height:calc(var(--koma) * 3);overflow:hidden;
    background:var(--reel-bg);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
    cursor:pointer;
  }
  .reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:22%;z-index:3;pointer-events:none;}
  .reel::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);}
  .reel::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent);}
  .reel .line{position:absolute;left:0;right:0;top:var(--koma);height:var(--koma);z-index:2;pointer-events:none;transition:box-shadow .15s;}
  .reel.hit .line{box-shadow:inset 0 0 0 3px rgba(241,210,122,.95), 0 0 18px rgba(241,210,122,.8);}
  .reel.armed{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 0 0 2px rgba(255,255,255,.35);}
  .strip{position:absolute;left:0;right:0;top:0;will-change:transform;}
  .strip.blur{filter:blur(1.5px);}
  .koma{
    position:absolute;left:0;right:0;height:var(--koma);
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid rgba(20,33,61,.12);font-weight:800;font-size:calc(100vw / 34);
  }
  /* 図柄。symbols.js のスプライトを <svg><use> で参照する (viewBox 240×80) */
  .sym{display:block;width:82%;height:74%;}

  /* ---- 操作パネル(左上) ---- */
  .bar{
    position:fixed;left:12px;top:12px;z-index:10;
    display:flex;flex-direction:column;gap:8px;max-width:270px;
    background:rgba(10,12,22,.9);border:1px solid rgba(201,162,74,.35);border-radius:10px;
    padding:12px 14px;font-size:12.5px;
  }
  .bar label{display:flex;align-items:center;gap:8px;}
  .bar input[type=text]{flex:1;background:#08060a;border:1px solid #3a3348;color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;}
  .bar button{background:#1e1a2c;border:1px solid var(--frame-dim);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;}
  .bar .st{font-size:11.5px;color:#9d97ad;}
  .bar .st.on{color:#7cf2a8;}
  .bar .keys{font-size:11px;color:#8a8398;line-height:1.6;}
  .bar.hidden{display:none;}
  .toggle-bar{position:fixed;right:12px;top:12px;z-index:11;background:rgba(10,12,22,.7);border:1px solid rgba(201,162,74,.35);color:var(--frame);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;}
  @media (prefers-reduced-motion: reduce){ .strip.blur{filter:none;} }
</style>
</head>
<body>

<button class="toggle-bar" id="toggle-bar" aria-label="操作パネル表示切替">⚙</button>
<div class="bar hidden" id="bar">
  <label><input type="radio" name="mode" value="local" checked> ローカル試打（内部抽選あり）</label>
  <label><input type="radio" name="mode" value="link"> 主制御と連動（god_main_board.py）</label>
  <label>中継 <input type="text" id="ws-url" value="ws://localhost:8787" spellcheck="false"><button id="btn-conn">接続</button></label>
  <div class="st" id="ws-st">未接続</div>
  <label><input type="checkbox" id="auto-stop"> 停止を自動で行う（ローカル）</label>
  <label><input type="checkbox" id="show-navi" checked> ナビランプを表示</label>
  <div class="keys">Space/Enter = レバー　停止 = ← ↓ → / J K L / リールをクリック</div>
</div>

<div class="unit">
  <div class="navi" id="navi"><span>1</span><span>2</span><span>3</span></div>
  <div class="window">
    <div class="reel" id="reel-0"><div class="strip" id="strip-0"></div><div class="line"></div></div>
    <div class="reel" id="reel-1"><div class="strip" id="strip-1"></div><div class="line"></div></div>
    <div class="reel" id="reel-2"><div class="strip" id="strip-2"></div><div class="line"></div></div>
  </div>
</div>

<script src="symbols.js"></script>
<script src="reel_window.js"></script>
<script>
(async function(){
  "use strict";

  // 図柄配列: main_board/reels.json (主制御 god_main_board.py と同じ唯一の定義) を読み込む
  let DATA;
  try{ DATA = await SlotReels.load("../main_board/reels.json"); }
  catch(e){
    document.getElementById("ws-st").textContent = "配列を読めません: " + e.message + "（8787 経由で開いていますか）";
    document.getElementById("bar").classList.remove("hidden");
    return;
  }
  const REELS = DATA.reels;
  const KOMA = DATA.koma, MAX_SLIP = 4;
  SlotSymbols.install(document);

  // ---------------------------------------------------------------
  // リール物理
  //   約80rpm(28コマ/秒)。停止操作時の中段コマ + 滑り(0-4)を主制御と同じ規則で決め、
  //   そこまで等速で流してから止め、止まった瞬間に小さく戻る。
  //   DOM 構築と停止位置の描画 (build / render) は reel_window.js の ReelView が持つ。
  // ---------------------------------------------------------------
  const SPEED = 28, SPINUP = 0.55;

  class Reel extends SlotReels.ReelView {
    constructor(idx){
      super(document.getElementById(`reel-${idx}`), document.getElementById(`strip-${idx}`), REELS[idx]);
      this.idx = idx;
      this.vel = 0; this.state = "stop"; this.target = null; this.onStop = null;
    }
    start(){
      this.state = "spinup"; this.vel = 0; this.target = null;
      this.el.classList.remove("hit", "armed");
      this.strip.classList.add("blur");
      this.t0 = performance.now();
    }
    pushPos(){ return Math.round(this.pos) % KOMA; }
    stopAt(target, cb){
      if(this.state !== "spin") return false;
      this.target = ((target % KOMA) + KOMA) % KOMA;
      this.onStop = cb || null;
      this.state = "stopping";
      this.el.classList.remove("armed");
      return true;
    }
    tick(dt){
      if(this.state === "stop") return;
      if(this.state === "spinup"){
        const t = (performance.now() - this.t0) / 1000;
        this.vel = SPEED * Math.min(1, t / SPINUP);
        if(t >= SPINUP){ this.state = "spin"; this.vel = SPEED; if(mode === "local") this.el.classList.add("armed"); }
      }
      const step = this.vel * dt;
      if(this.state === "stopping"){
        const remain = ((this.target - this.pos) % KOMA + KOMA) % KOMA;
        if(step >= remain){
          this.pos = this.target; this.vel = 0; this.state = "stop";
          this.strip.classList.remove("blur");
          this.render(); this.bounce();
          const cb = this.onStop; this.onStop = null;
          if(cb) cb(this);
          return;
        }
      }
      this.pos = (this.pos + step) % KOMA;
      this.render();
    }
    bounce(){
      const px = this.komaPx();
      this.strip.style.transition = "transform .06s";
      this.strip.style.transform = `translateY(${(1 + this.pos) * px + px * 0.09}px)`;
      setTimeout(()=>{ this.strip.style.transition = "transform .09s"; this.render(); }, 60);
      setTimeout(()=>{ this.strip.style.transition = ""; }, 170);
    }
  }

  const reels = [0,1,2].map(i => new Reel(i));
  let last = performance.now();
  (function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    reels.forEach(r => r.tick(dt));
    requestAnimationFrame(loop);
  })(performance.now());

  // 停止制御(主制御 stop_reel と同じ規則)
  function stopControl(reel, pushPos, targetSym){
    if(targetSym){
      for(let s = 0; s <= MAX_SLIP; s++) if(reel.symbolAt(pushPos + s) === targetSym) return (pushPos + s) % KOMA;
      return (pushPos + MAX_SLIP) % KOMA;              // 届かない → 取りこぼし
    }
    for(let s = 0; s <= MAX_SLIP; s++){                // 非成立の 神 / 赤7 は蹴る
      const sym = reel.symbolAt(pushPos + s);
      if(sym !== "神" && sym !== "赤7") return (pushPos + s) % KOMA;
    }
    return pushPos;
  }

  function highlight(){
    const line = reels.map(r => r.symbolAt(r.pos));
    const hit = line.every(s => s === line[0]) && (line[0] === "神" || line[0] === "赤7");
    reels.forEach(r => r.el.classList.toggle("hit", hit));
  }

  const $ = id => document.getElementById(id);
  const naviEls = [...$("navi").querySelectorAll("span")];
  const ORDER = {1:[0,1,2],2:[0,2,1],3:[1,0,2],4:[2,0,1],5:[1,2,0],6:[2,1,0]};   // 押し順番号 → リール順
  function setNavi(order){
    const seq = order ? ORDER[order] : null;
    naviEls.forEach((el,i)=>{
      el.textContent = seq ? seq.indexOf(i) + 1 : i + 1;
      el.classList.toggle("on", !!seq);
    });
  }

  // ---------------------------------------------------------------
  // ローカル試打: 通常時テーブルと同じ重みで内部抽選 → リール停止
  // ---------------------------------------------------------------
  const LOTTERY = [["神揃い",8],["押順ベル",40000],["共通ベル",260],["リプレイ",6000],["スイカ",650],["弱チェリー",760],["強チェリー",190],["チャンス目",360]];
  const TARGET = {"神揃い":"神","リプレイ":"リプ","共通ベル":"ベル","押順ベル":"ベル","スイカ":"スイカ","弱チェリー":"チェリー","強チェリー":"チェリー"};

  let mode = "local", game = null, stopped = 0;

  function lottery(){
    let r = Math.floor(Math.random() * 65536), acc = 0;
    for(const [name, w] of LOTTERY){ acc += w; if(r < acc) return name; }
    return "ハズレ";
  }

  function leverOn(){
    if(mode !== "local" || game) return;
    const flag = lottery();
    game = { flag, answer: Math.floor(Math.random() * 6) + 1, order: [], target: TARGET[flag] || null, miss: false };
    stopped = 0;
    reels.forEach(r => r.start());
    if($("auto-stop").checked) [0,1,2].forEach((i,k)=> setTimeout(()=> stopReel(i), 900 + k * 420));
  }

  function stopReel(i){
    if(mode !== "local" || !game) return;
    const reel = reels[i];
    if(reel.state !== "spin") return;
    game.order.push(i);
    let target = game.target;
    if(game.flag === "押順ベル"){       // 正解押し順と一致したときだけ引き込む
      if(ORDER[game.answer][game.order.length - 1] !== i) game.miss = true;
      if(game.miss) target = null;
    }
    reel.stopAt(stopControl(reel, reel.pushPos(), target), ()=>{
      if(++stopped === 3){ highlight(); setTimeout(()=>{ game = null; }, 120); }
    });
  }

  // ---------------------------------------------------------------
  // 主制御連動: 中継サーバーの mainBoard(state) を受け、reelPos へ 左→中→右 と自動停止
  // ---------------------------------------------------------------
  let ws = null, queue = [], busy = false;
  const wsUrl = $("ws-url"), wsSt = $("ws-st"), btnConn = $("btn-conn");

  function connect(){
    if(ws){ ws.close(); ws = null; return; }
    try{ ws = new WebSocket(wsUrl.value.trim()); }catch(e){ wsSt.textContent = "URLが不正です"; return; }
    wsSt.textContent = "接続中..."; btnConn.textContent = "切断";
    ws.addEventListener("open", ()=>{ wsSt.textContent = "接続済み（主制御の送信待ち）"; wsSt.className = "st on"; });
    ws.addEventListener("message", ev => {
      let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if(d && d.action === "mainBoard" && d.type === "state"){ queue.push(d); pump(); }
    });
    ws.addEventListener("close", ()=>{ ws = null; wsSt.textContent = "未接続"; wsSt.className = "st"; btnConn.textContent = "接続"; });
    ws.addEventListener("error", ()=>{ wsSt.textContent = "接続できません（run_server.bat は起動していますか）"; });
  }

  function pump(){
    if(busy || mode !== "link") return;
    const d = queue.shift();
    if(!d) return;
    busy = true;
    const fast = queue.length > 1;                       // 詰まっているときは短縮テンポ
    const T = fast ? [0.45, 0.65, 0.85] : [1.15, 1.6, 2.05];
    wsSt.textContent = `受信中 / 設定${d.setting ?? "?"}　${d.game}G ${d.flag}`;
    setNavi(d.navi || null);
    reels.forEach(r => r.start());
    const pos = Array.isArray(d.reelPos) ? d.reelPos : null;
    let done = 0;
    [0,1,2].forEach((i,k)=> setTimeout(()=>{
      const reel = reels[i];
      const target = pos ? pos[i] : stopControl(reel, reel.pushPos(), (d.reel && d.reel[i]) || null);
      if(reel.state !== "spin"){ reel.state = "spin"; reel.vel = SPEED; }
      reel.stopAt(target, ()=>{
        if(++done === 3){ highlight(); setTimeout(()=>{ setNavi(null); busy = false; pump(); }, fast ? 120 : 300); }
      });
    }, T[k] * 1000));
  }

  // ---------------------------------------------------------------
  // 入力
  // ---------------------------------------------------------------
  reels.forEach((r,i)=> r.el.addEventListener("click", ()=> stopReel(i)));
  document.addEventListener("keydown", e => {
    if(e.target && e.target.tagName === "INPUT") return;
    const k = e.key;
    if(k === " " || k === "Enter"){ e.preventDefault(); leverOn(); }
    else if(k === "ArrowLeft" || k === "j" || k === "J") stopReel(0);
    else if(k === "ArrowDown" || k === "k" || k === "K") stopReel(1);
    else if(k === "ArrowRight" || k === "l" || k === "L") stopReel(2);
  });
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener("change", ()=>{
    mode = r.value;
    reels.forEach(x => x.el.classList.remove("armed"));
    if(mode === "link"){ if(!ws) connect(); pump(); } else setNavi(null);
  }));
  btnConn.addEventListener("click", connect);
  $("show-navi").addEventListener("change", ()=> $("navi").classList.toggle("hidden", !$("show-navi").checked));
  $("toggle-bar").addEventListener("click", ()=> $("bar").classList.toggle("hidden"));
  window.addEventListener("resize", ()=> reels.forEach(r => r.render()));

  // URLクエリ:
  //   mode=link          主制御と連動で起動
  //   ws=ws://host:port  中継サーバーのURL
  //   hidebar=1          操作パネルと歯車を隠す(OBS向け)
  //   navi=0             ナビランプを隠す
  //   bg=00ff00          背景色(クロマキー用)。未指定なら透過
  const q = new URLSearchParams(location.search);
  if(q.get("ws")) wsUrl.value = q.get("ws");
  if(q.get("hidebar") === "1"){ $("bar").classList.add("hidden"); $("toggle-bar").style.display = "none"; }
  if(q.get("navi") === "0"){ $("show-navi").checked = false; $("navi").classList.add("hidden"); }
  if(q.get("bg")) document.body.style.background = "#" + q.get("bg").replace(/^#/, "");
  if(q.get("mode") === "link"){ const r = document.querySelector('input[name=mode][value=link]'); r.checked = true; r.dispatchEvent(new Event("change")); }
})();
</script>
</body>
</html>
